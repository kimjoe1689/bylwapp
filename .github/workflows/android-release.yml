name: Android release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: app
        run: flutter pub get

      - name: Build release APKs per ABI
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bylwapp-android-apk
          path: app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      - name: Publish prerelease or release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: app/build/app/outputs/flutter-apk/*-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
