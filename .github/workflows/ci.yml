name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: server/go.sum
      - run: CGO_ENABLED=0 go test ./...
      - run: CGO_ENABLED=0 go build -o /tmp/bylw-server ./cmd/server

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install SQLite for sqflite_common_ffi
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
